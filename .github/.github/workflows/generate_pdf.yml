name: Generate PDF Document

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install System Dependencies (WeasyPrint)
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential python3-dev python3-pip python3-setuptools python3-wheel python3-cffi libcairo2 libpango-1.0-0 libgdk-pixbuf2.0-0 libffi-dev shared-mime-info

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install weasyprint

    - name: Run Script to Generate PDF
      run: python generate_pdf.py

    - name: Upload PDF Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Rancangan-Pembelajaran-PDF
        path: Rancangan_Pembelajaran_Deep_Learning_PBL.pdf
